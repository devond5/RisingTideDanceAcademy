<ng-template #rtda>
  <div class="flex flex-col items-center w-full h-full">
    <h1 class="text-black">Our Story</h1>
    <div></div>
  </div>
</ng-template>

<ng-template #staff>
  <div class="flex flex-col items-center w-full h-full">
    <h1 class="text-black">Our People</h1>
    <div class="bg-black rounded-2xl w-3xl h-full mb-5 flex flex-col justify-center">
      <p-carousel [value]="instructors" [numVisible]="1" [numScroll]="1">
        <ng-template let-instructor pTemplate="item">
          <div class="px-4 flex justify-center">
            <div class="flex flex-col items-center">
              <h3 class="text-2xl font-semibold text-white mb-1">{{ instructor.teacherName }}</h3>
              @if (instructor.teacherPhoto) {
                <div class="group w-75 h-75 relative overflow-hidden rounded-xl mb-5 bg-neutral-800 aspect-5/5">
                  <img
                    [src]="instructor.teacherPhoto"
                    [alt]="instructor.teacherName"
                    class="w-75 h-75 object-cover transition duration-700 group-hover:scale-105 group-hover:opacity-80 grayscale group-hover:grayscale-0"
                  />
                </div>
              }

              <p class="text-sm font-medium tracking-widest text-neutral-500 uppercase mb-4">{{ instructor.teacherStyles.join(', ') }}</p>
              <p class="text-neutral-400 text-sm leading-relaxed">
                {{ instructor.teacherBio }}
              </p>
            </div>
          </div>
        </ng-template>
      </p-carousel>
    </div>
  </div>
</ng-template>

<ng-template #studio>
  <div class="flex flex-col items-center w-full h-full">
    <h1 class="text-black">Our Studio</h1>
  </div>
</ng-template>

<div class="flex flex-col h-full w-full">
  <p-tabs [value]="tabValue()" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab [value]="'0'" class="flex items-center !gap-2 text-inherit">
        <span>RTDA</span>
      </p-tab>
      <p-tab [value]="'1'" class="flex items-center !gap-2 text-inherit">
        <span>Staff</span>
      </p-tab>
      <p-tab [value]="'2'" class="flex items-center !gap-2 text-inherit">
        <span>Studio</span>
      </p-tab>
    </p-tablist>
  </p-tabs>

  @switch (tabValue()) {
    @case ('0') {
      <ng-container [ngTemplateOutlet]="rtda" />
    }

    @case ('1') {
      <ng-container [ngTemplateOutlet]="staff" />
    }

    @case ('2') {
      <ng-container [ngTemplateOutlet]="studio" />
    }
  }
</div>
